<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bg_mermaid" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#0099cc"/>
      <stop offset="100%" stop-color="#003366"/>
    </radialGradient>
    <linearGradient id="tail_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5cc"/>
      <stop offset="100%" stop-color="#006644"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg_mermaid)" stroke="#0077aa" stroke-width="2"/>
  <!-- Bubbles -->
  <circle cx="22" cy="30" r="3" fill="none" stroke="white" stroke-width="1" opacity="0.5"/>
  <circle cx="30" cy="18" r="2" fill="none" stroke="white" stroke-width="1" opacity="0.4"/>
  <circle cx="75" cy="25" r="2.5" fill="none" stroke="white" stroke-width="1" opacity="0.5"/>
  <!-- Mermaid tail -->
  <path d="M38 55 Q50 90 62 55" fill="url(#tail_grad)" stroke="#00b899" stroke-width="1.5"/>
  <!-- Tail fins -->
  <path d="M38 55 Q28 75 35 85 Q50 70 38 55Z" fill="#00cc99" opacity="0.9"/>
  <path d="M62 55 Q72 75 65 85 Q50 70 62 55Z" fill="#00cc99" opacity="0.9"/>
  <!-- Tail scale lines -->
  <path d="M42 62 Q50 60 58 62" fill="none" stroke="#009977" stroke-width="1" opacity="0.7"/>
  <path d="M40 70 Q50 67 60 70" fill="none" stroke="#009977" stroke-width="1" opacity="0.7"/>
  <!-- Body -->
  <ellipse cx="50" cy="45" rx="12" ry="14" fill="#ffccaa"/>
  <!-- Shell top -->
  <path d="M40 40 Q50 34 60 40" fill="#ff6688" stroke="#cc3366" stroke-width="1"/>
  <path d="M40 40 Q50 46 60 40" fill="#ff88aa" stroke="#cc3366" stroke-width="1"/>
  <!-- Hair -->
  <path d="M38 38 Q32 25 40 18 Q50 14 60 18 Q68 25 62 38" fill="#cc2200" stroke="#aa1100" stroke-width="1"/>
  <!-- Face -->
  <circle cx="50" cy="36" r="10" fill="#ffccaa"/>
  <circle cx="46" cy="34" r="1.5" fill="#553311"/>
  <circle cx="54" cy="34" r="1.5" fill="#553311"/>
  <path d="M46 39 Q50 42 54 39" fill="none" stroke="#cc6677" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Red hair detail -->
  <path d="M40 30 Q36 20 42 15" fill="none" stroke="#cc2200" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 30 Q64 20 58 15" fill="none" stroke="#cc2200" stroke-width="3" stroke-linecap="round"/>
</svg>

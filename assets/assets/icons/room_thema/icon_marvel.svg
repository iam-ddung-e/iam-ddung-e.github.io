<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg_marvel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ed1d24"/>
      <stop offset="100%" stop-color="#a30c0f"/>
    </linearGradient>
    <linearGradient id="m_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5e0"/>
    </linearGradient>
  </defs>
  <!-- 빨간 박스 (마블 로고 스타일) -->
  <rect x="6" y="22" width="88" height="56" rx="8" ry="8" fill="url(#bg_marvel)" stroke="#7a0509" stroke-width="2"/>
  <!-- 상단 흰색 띠 -->
  <rect x="6" y="22" width="88" height="6" rx="3" ry="3" fill="#ffffff" opacity="0.6"/>
  <!-- 하단 흰색 띠 -->
  <rect x="6" y="72" width="88" height="6" rx="3" ry="3" fill="#ffffff" opacity="0.4"/>
  <!-- M 글자 (마블 스타일) -->
  <text x="50" y="62" font-family="Arial Black, Helvetica, sans-serif" font-weight="900" font-size="38" fill="url(#m_grad)" text-anchor="middle" letter-spacing="-2">M</text>
  <!-- 작은 별 (Marvel character feel) -->
  <polygon points="15,40 17,46 23,46 18,50 20,56 15,52 10,56 12,50 7,46 13,46" fill="#ffd600" opacity="0.85"/>
  <polygon points="85,55 87,61 93,61 88,65 90,71 85,67 80,71 82,65 77,61 83,61" fill="#ffd600" opacity="0.85"/>
</svg>

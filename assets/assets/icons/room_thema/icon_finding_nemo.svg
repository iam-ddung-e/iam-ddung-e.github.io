<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bg_nemo" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0288d1"/>
      <stop offset="100%" stop-color="#01579b"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg_nemo)" stroke="#0277bd" stroke-width="2"/>
  <!-- Bubbles -->
  <circle cx="20" cy="25" r="4" fill="none" stroke="white" stroke-width="1" opacity="0.5"/>
  <circle cx="75" cy="20" r="3" fill="none" stroke="white" stroke-width="1" opacity="0.4"/>
  <circle cx="82" cy="35" r="2" fill="none" stroke="white" stroke-width="1" opacity="0.5"/>
  <circle cx="15" cy="45" r="2.5" fill="none" stroke="white" stroke-width="1" opacity="0.4"/>
  <!-- Coral -->
  <path d="M10 90 Q14 75 18 80 Q22 70 26 78 Q30 68 34 76 Q34 90 10 90Z" fill="#e53935" opacity="0.8"/>
  <path d="M66 90 Q70 72 74 78 Q78 68 82 76 Q86 72 90 80 Q90 90 66 90Z" fill="#ff7043" opacity="0.8"/>
  <!-- Seaweed -->
  <path d="M45 90 Q40 78 45 68 Q50 58 45 48" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round"/>
  <path d="M55 90 Q60 78 55 68 Q50 58 55 48" fill="none" stroke="#388e3c" stroke-width="3" stroke-linecap="round"/>
  <!-- Nemo body -->
  <ellipse cx="50" cy="48" rx="18" ry="13" fill="#ff6d00"/>
  <!-- White stripes -->
  <ellipse cx="44" cy="48" rx="3.5" ry="12" fill="white" opacity="0.9"/>
  <ellipse cx="56" cy="48" rx="3.5" ry="12" fill="white" opacity="0.9"/>
  <!-- Orange overlay to give stripe effect -->
  <ellipse cx="44" cy="48" rx="2" ry="12" fill="#ff6d00"/>
  <ellipse cx="56" cy="48" rx="2" ry="12" fill="#ff6d00"/>
  <!-- Black outlines on stripes -->
  <ellipse cx="44" cy="48" rx="3.5" ry="12" fill="none" stroke="#222" stroke-width="0.8"/>
  <ellipse cx="56" cy="48" rx="3.5" ry="12" fill="none" stroke="#222" stroke-width="0.8"/>
  <!-- Tail fin -->
  <path d="M66 42 Q80 38 82 48 Q80 58 66 54Z" fill="#ff6d00" stroke="#222" stroke-width="0.8"/>
  <line x1="68" y1="44" x2="80" y2="48" stroke="#222" stroke-width="0.6" opacity="0.5"/>
  <line x1="68" y1="52" x2="80" y2="48" stroke="#222" stroke-width="0.6" opacity="0.5"/>
  <!-- Top fin -->
  <path d="M46 36 Q50 28 58 36" fill="#ff6d00" stroke="#222" stroke-width="0.8"/>
  <!-- Bottom fins -->
  <path d="M44 58 Q40 66 46 65" fill="#ff8c00" stroke="#222" stroke-width="0.8"/>
  <path d="M56 58 Q60 66 54 65" fill="#ff8c00" stroke="#222" stroke-width="0.8"/>
  <!-- Eye -->
  <circle cx="38" cy="44" r="5" fill="white"/>
  <circle cx="38" cy="44" r="3" fill="#1565c0"/>
  <circle cx="38" cy="44" r="1.5" fill="black"/>
  <circle cx="37" cy="43" r="0.8" fill="white"/>
  <!-- Mouth smile -->
  <path d="M34 50 Q37 53 41 50" fill="none" stroke="#bf360c" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Body outline -->
  <ellipse cx="50" cy="48" rx="18" ry="13" fill="none" stroke="#222" stroke-width="1"/>
</svg>
